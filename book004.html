<!DOCTYPE html>
<!--
  作者：陈福
  建立时间：2026-11-02
  使用模型：DeepSeek-V4.1-Flash
  功能名称：文学社科书籍分类 Tab 选项卡
  功能简介：复刻两张参考截图的书籍分类页面。主容器白底卡片，四个子选项卡
            （主编推荐 / 流行小说 / 社科历史 / 文学艺术），默认选中"主编推荐"。
            每个面板含主编位、4×2 书籍网格和右侧订阅榜。点击切换逻辑复用 js/cf_tabs.js。
-->
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>文学社科 · Tab 选项卡 | 陈福</title>
	<style>
		/* ===== 基础 ===== */
		* { box-sizing: border-box; }
		html, body { margin: 0; padding: 0; }
		body {
			min-height: 100vh;
			background: #2b2f36;
			font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
			font-size: 14px;
			line-height: 1.65;
			color: #34404a;
			-webkit-font-smoothing: antialiased;
		}

		/* ===== 外壳（深色背景上的白底卡片，模拟截图中的容器效果） ===== */
		.cf_wrap {
			max-width: 980px;
			margin: 48px auto;
			padding: 0 24px;
		}

		.cf_homebar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin-bottom: 14px;
			color: #cdd4de;
			font-size: 13px;
		}

		.cf_homebar a {
			color: #cdd4de;
			text-decoration: none;
			transition: color 150ms ease;
		}
		.cf_homebar a:hover { color: #ffb566; }

		.cf_card {
			background: #ffffff;
			border-radius: 6px;
			box-shadow: 0 8px 28px rgba(0, 0, 0, 0.32);
			overflow: hidden;
		}

		/* ===== 主标题区 ===== */
		.cf_header {
			padding: 22px 28px 0;
			border-bottom: 3px solid #3d8a49;
		}

		.cf_header h1 {
			margin: 0;
			font-family: "Songti SC", "SimSun", serif;
			font-size: 26px;
			font-weight: 700;
			color: #1f2933;
			letter-spacing: 0.04em;
		}

		/* ===== 选项卡栏 ===== */
		.cf_tab_bar {
			display: flex;
			gap: 0;
			padding: 0 28px;
			border-bottom: 1px solid #e5e8ec;
		}

		.cf_tab_item {
			position: relative;
			appearance: none;
			background: none;
			border: 0;
			padding: 14px 22px;
			color: #7b8694;
			font-family: inherit;
			font-size: 14px;
			cursor: pointer;
			transition: color 160ms ease;
		}

		.cf_tab_item:hover { color: #1f2933; }

		.cf_tab_item::after {
			content: "";
			position: absolute;
			left: 14px;
			right: 14px;
			bottom: -1px;
			height: 3px;
			background: #3d8a49;
			transform: scaleX(0);
			transition: transform 220ms cubic-bezier(0.2, 0.8, 0.3, 1);
		}

		.cf_tab_item--active {
			color: #1f2933;
			font-weight: 700;
		}

		.cf_tab_item--active::after { transform: scaleX(1); }

		.cf_tab_item:focus-visible {
			outline: 2px solid #3d8a49;
			outline-offset: -4px;
		}

		/* ===== 面板切换 ===== */
		.cf_tab_panel { display: none; }
		.cf_tab_panel--active {
			display: block;
			animation: cf_panelIn 240ms ease both;
		}
		@keyframes cf_panelIn {
			from { opacity: 0; transform: translateY(6px); }
			to { opacity: 1; transform: translateY(0); }
		}
		@media (prefers-reduced-motion: reduce) {
			.cf_tab_panel--active { animation: none; }
			.cf_tab_item::after { transition: none; }
		}

		/* ===== 面板内部布局：三栏（主编位 | 书籍网格 | 订阅榜） ===== */
		.cf_panel_inner {
			display: grid;
			grid-template-columns: 220px 1fr 200px;
			gap: 24px;
			padding: 24px 28px 32px;
		}

		/* 某些面板没有主编大封面时，退化成两栏 */
		.cf_panel_inner--dual {
			grid-template-columns: 1fr 200px;
		}

		/* ===== 左栏：主编推荐大封面 ===== */
		.cf_editor {
			position: relative;
		}

		.cf_editor_badge {
			position: absolute;
			top: 0; left: 0;
			background: #e6a23c;
			color: #fff;
			font-size: 12px;
			font-weight: 700;
			padding: 4px 10px;
			z-index: 2;
		}

		.cf_editor_cover {
			display: block;
			width: 100%;
			aspect-ratio: 3 / 4;
			object-fit: cover;
			box-shadow: 0 4px 14px rgba(0,0,0,0.18);
		}

		.cf_editor_title {
			margin: 12px 0 4px;
			font-family: "Songti SC", "SimSun", serif;
			font-size: 15px;
			font-weight: 700;
			color: #1f2933;
		}

		.cf_editor_title a {
			color: inherit;
			text-decoration: none;
		}
		.cf_editor_title a:hover { color: #3d8a49; }

		.cf_editor_sum {
			margin: 0 0 10px;
			color: #52606d;
			font-size: 12px;
			line-height: 1.6;
			display: -webkit-box;
			-webkit-line-clamp: 3;
			-webkit-box-orient: vertical;
			overflow: hidden;
		}

		.cf_editor_list {
			margin: 0; padding: 0; list-style: none;
		}
		.cf_editor_list li {
			position: relative;
			padding-left: 12px;
			color: #52606d;
			font-size: 12px;
			line-height: 1.9;
		}
		.cf_editor_list li::before {
			content: "•";
			position: absolute; left: 0;
			color: #3d8a49;
		}

		/* ===== 中间：书籍网格 4×2 ===== */
		.cf_books {
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			gap: 18px 14px;
		}

		.cf_book {
			display: block;
			text-decoration: none;
			color: inherit;
			transition: transform 160ms ease;
		}

		.cf_book:hover { transform: translateY(-2px); }

		.cf_book_cover {
			display: block;
			width: 100%;
			aspect-ratio: 3 / 4;
			object-fit: cover;
			box-shadow: 0 2px 6px rgba(0,0,0,0.12);
			margin-bottom: 8px;
		}

		.cf_book_title {
			margin: 0 0 4px;
			font-size: 13px;
			font-weight: 600;
			color: #1f2933;
			line-height: 1.4;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.cf_book:hover .cf_book_title { color: #3d8a49; }

		.cf_book_price {
			color: #c8102e;
			font-size: 14px;
			font-weight: 700;
		}

		.cf_book_price::before {
			content: "¥";
			font-size: 12px;
			margin-right: 1px;
		}

		/* ===== 右栏：订阅榜 ===== */
		.cf_rank {
			border-left: 1px solid #e5e8ec;
			padding-left: 18px;
		}

		.cf_rank_title {
			margin: 0 0 14px;
			font-size: 14px;
			font-weight: 700;
			color: #1f2933;
			padding-bottom: 8px;
			border-bottom: 2px solid #3d8a49;
			display: inline-block;
		}

		.cf_rank_list {
			margin: 0; padding: 0; list-style: none;
		}

		.cf_rank_item {
			display: flex;
			align-items: baseline;
			gap: 8px;
			padding: 5px 0;
			font-size: 12px;
			color: #52606d;
			border-bottom: 1px dashed #eef0f3;
		}

		.cf_rank_no {
			flex: 0 0 auto;
			width: 18px;
			font-family: "Consolas", monospace;
			font-weight: 700;
			color: #3d8a49;
			font-size: 13px;
		}
		.cf_rank_item:nth-child(-n+3) .cf_rank_no {
			color: #c8102e;
		}

		.cf_rank_name {
			flex: 1;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			cursor: pointer;
		}
		.cf_rank_name:hover { color: #3d8a49; }

		/* ===== 页脚 ===== */
		.cf_foot {
			padding: 14px 28px 20px;
			color: #9aa5b2;
			font-size: 12px;
			border-top: 1px solid #eef0f3;
		}

		/* ===== 移动端 ===== */
		@media (max-width: 880px) {
			.cf_wrap { margin: 24px 0; padding: 0 12px; }
			.cf_panel_inner,
			.cf_panel_inner--dual {
				grid-template-columns: 1fr;
				gap: 22px;
			}
			.cf_rank { border-left: 0; padding-left: 0; border-top: 1px solid #e5e8ec; padding-top: 14px; }
			.cf_editor_cover { max-width: 200px; }
			.cf_books { grid-template-columns: repeat(3, 1fr); }
			.cf_tab_item { padding: 12px 14px; font-size: 13px; }
		}
		@media (max-width: 480px) {
			.cf_books { grid-template-columns: repeat(2, 1fr); }
			.cf_header, .cf_tab_bar, .cf_panel_inner, .cf_foot { padding-left: 16px; padding-right: 16px; }
		}
	</style>
</head>
<body>
	<!--
	  脚本级说明（js/cf_tabs.js 在页面末尾外部引用）
	  作者：陈福
	  建立时间：2026-11-02
	  使用模型：DeepSeek-V4.1-Flash
	  功能名称：文学社科 Tab 选项卡页面
	  数据来源：img/book/ 目录的 a1~a8 / b1~b8 / c1~c8 / rui.jpg
	  主流程：cf_tabs.js 自动扫描 [data-cf-tab] 容器，事件委托监听 click/keydown，
	          每次切换先 cf_clearActive 清空同组全部选中状态，再 cf_setActive 把
	          当前项及其对应面板设为选中；书籍卡片与订阅榜通过 cf_books / cf_rank
	          两个辅助渲染函数按数据数组生成 DOM。
	-->

	<div class="cf_wrap">
		<div class="cf_homebar">
			<span>课程练习 · Tab 选项卡复刻</span>
			<a href="index.html">← 返回首页</a>
		</div>

		<div class="cf_card">
			<!-- 主标题 + Tab 栏（共用一个 data-cf-tab 容器） -->
			<div class="cf_tab" data-cf-tab>
				<div class="cf_header">
					<h1>文学社科</h1>
				</div>

				<div class="cf_tab_bar" role="tablist" aria-label="文学社科分类">
					<!-- 默认选中：主编推荐 -->
					<button class="cf_tab_item cf_tab_item--active" type="button" role="tab"
						data-cf_tab_target="cf_panel_editor" aria-selected="true">主编推荐</button>
					<button class="cf_tab_item" type="button" role="tab"
						data-cf_tab_target="cf_panel_popular" aria-selected="false">流行小说</button>
					<button class="cf_tab_item" type="button" role="tab"
						data-cf_tab_target="cf_panel_social" aria-selected="false">社科历史</button>
					<button class="cf_tab_item" type="button" role="tab"
						data-cf_tab_target="cf_panel_art" aria-selected="false">文学艺术</button>
				</div>

				<!-- 面板一：主编推荐（默认显示） -->
				<div class="cf_tab_panel cf_tab_panel--active" id="cf_panel_editor" role="tabpanel">
					<div class="cf_panel_inner">
						<!-- 左栏：大封面 + 简介 -->
						<aside class="cf_editor">
							<span class="cf_editor_badge">★ 力荐</span>
							<img class="cf_editor_cover" src="img/book/rui.jpg" alt="芮成钢《虚实之间》">
							<h3 class="cf_editor_title"><a href="#">芮成钢：《虚实之间》</a></h3>
							<p class="cf_editor_sum">有十年记者生涯对东西方文化的洞悉，又有与奥巴马、骑霞等政要零距离接触...</p>
							<ul class="cf_editor_list">
								<li>兄弟我在义乌的发财史</li>
								<li>读佛即是拜佛：唐僧传</li>
								<li>二战苏联老兵装备</li>
							</ul>
						</aside>

						<!-- 中栏：书籍网格（数据由 JS 渲染） -->
						<div class="cf_books" id="cf_books_editor"></div>

						<!-- 右栏：订阅榜 -->
						<aside class="cf_rank">
							<h3 class="cf_rank_title cf_rank_title--popular">流行小说订阅榜</h3>
							<ol class="cf_rank_list" id="cf_rank_editor"></ol>
						</aside>
					</div>
				</div>

				<!-- 面板二：流行小说（两栏：书籍网格 + 订阅榜，无主编大封面） -->
				<div class="cf_tab_panel" id="cf_panel_popular" role="tabpanel">
					<div class="cf_panel_inner cf_panel_inner--dual">
						<div class="cf_books" id="cf_books_popular"></div>
						<aside class="cf_rank">
							<h3 class="cf_rank_title">流行小说订阅榜</h3>
							<ol class="cf_rank_list" id="cf_rank_popular"></ol>
						</aside>
					</div>
				</div>

				<!-- 面板三：社科历史 -->
				<div class="cf_tab_panel" id="cf_panel_social" role="tabpanel">
					<div class="cf_panel_inner cf_panel_inner--dual">
						<div class="cf_books" id="cf_books_social"></div>
						<aside class="cf_rank">
							<h3 class="cf_rank_title">社科历史订阅榜</h3>
							<ol class="cf_rank_list" id="cf_rank_social"></ol>
						</aside>
					</div>
				</div>

				<!-- 面板四：文学艺术 -->
				<div class="cf_tab_panel" id="cf_panel_art" role="tabpanel">
					<div class="cf_panel_inner cf_panel_inner--dual">
						<div class="cf_books" id="cf_books_art"></div>
						<aside class="cf_rank">
							<h3 class="cf_rank_title">文学艺术订阅榜</h3>
							<ol class="cf_rank_list" id="cf_rank_art"></ol>
						</aside>
					</div>
				</div>

			</div>

			<div class="cf_foot">本页复刻参考截图的书籍分类页面，封面与榜单文字均为示例数据。作者：陈福 · 2026-11-02</div>
		</div>
	</div>

	<!-- 外部复用的选项卡脚本 -->
	<script src="js/cf_tabs.js"></script>

	<script>
		/**
		 * 文件内数据 + 渲染逻辑

				popular: {

						{ cover: 'img/book/a1.jpg', title: '省长的女婿',     price: 5.98 },
						{ cover: 'img/book/a2.jpg', title: '辛夷坞：致青春', price: 5.00 },

					rank: [

						{ cover: 'img/book/c5.jpg', title: '古画新解',       price: 3.50 },
						{ cover: 'img/book/c6.jpg', title: '书法十讲',       price: 2.60 },
						{ cover: 'img/book/c7.jpg', title: '戏曲之美',       price: 2.90 },
						{ cover: 'img/book/c8.jpg', title: '敦煌漫笔',       price: 4.00 }
					],
					rank: [
						{ name: '诗词三百首赏析' },    { name: '人间词话（全文）' },
						{ name: '最美的诗与词' },      { name: '唐诗三百首（全文）' },
						{ name: '宋词选（全文）' },    { name: '元曲选（全文）' },
						{ name: '诗经选读（全文）' },  { name: '楚辞选（全文）' },
						{ name: '古文观止（全文）' },  { name: '世说新语（全文）' }
					]
				}
			};

			/**
			 * 渲染书籍网格
			 * 核心实现：用 createElement 逐个生成 <a class="cf_book"> → img / h3 / span
			 *          三个子节点，避免 innerHTML 字符串拼接；price 保留两位小数，
			 *          封面用 img 标签自然加载，失败时由浏览器 alt 兜底。
			 * @param {string} cf_targetId 目标容器 id（如 "cf_books_editor"）
			 * @param {Array}  cf_books    书籍数组，每项 { cover, title, price }
			 * @returns {void}
			 */
			function cf_renderBooks(cf_targetId, cf_books) {
				var cf_root = document.getElementById(cf_targetId);
				if (!cf_root) { return; }

				var cf_i, cf_a, cf_img, cf_h3, cf_span;
				for (cf_i = 0; cf_i < cf_books.length; cf_i += 1) {
					cf_a = document.createElement('a');
					cf_a.className = 'cf_book';
					cf_a.href = '#';

					cf_img = document.createElement('img');
					cf_img.className = 'cf_book_cover';
					cf_img.src = cf_books[cf_i].cover;
					cf_img.alt = cf_books[cf_i].title;
					cf_a.appendChild(cf_img);

					cf_h3 = document.createElement('h3');
					cf_h3.className = 'cf_book_title';
					cf_h3.textContent = cf_books[cf_i].title;
					cf_a.appendChild(cf_h3);

					cf_span = document.createElement('span');
					cf_span.className = 'cf_book_price';
					cf_span.textContent = Number(cf_books[cf_i].price).toFixed(2);
					cf_a.appendChild(cf_span);

					cf_root.appendChild(cf_a);
				}
			}

			/**
			 * 渲染订阅榜
			 * 核心实现：按数组顺序生成 <li>，序号由循环下标 + 1 得出，
			 *          不写死在数据里，后续 TopN 扩缩容只要改数据数组即可；
			 *          前三序号通过 CSS nth-child 改成红色高亮。
			 * @param {string} cf_targetId 目标容器 id（如 "cf_rank_editor"）
			 * @param {Array}  cf_rank     榜单数组，每项 { name }
			 * @returns {void}
			 */
			function cf_renderRank(cf_targetId, cf_rank) {
				var cf_root = document.getElementById(cf_targetId);
				if (!cf_root) { return; }

				var cf_i, cf_li, cf_no, cf_name;
				for (cf_i = 0; cf_i < cf_rank.length; cf_i += 1) {
					cf_li = document.createElement('li');
					cf_li.className = 'cf_rank_item';

					cf_no = document.createElement('span');
					cf_no.className = 'cf_rank_no';
					cf_no.textContent = String(cf_i + 1);
					cf_li.appendChild(cf_no);

					cf_name = document.createElement('span');
					cf_name.className = 'cf_rank_name';
					cf_name.textContent = cf_rank[cf_i].name;
					cf_li.appendChild(cf_name);

					cf_root.appendChild(cf_li);
				}
			}

			/**
			 * 一次性渲染四个面板的全部书籍网格与订阅榜
			 * 在 DOMContentLoaded 之后调用，保证 getElementById 能拿到容器节点
			 * @returns {void}
			 */
			function cf_renderAll() {
				cf_renderBooks('cf_books_editor',  cf_DATA.editor.books);
				cf_renderRank('cf_rank_editor',    cf_DATA.editor.rank);
				cf_renderBooks('cf_books_popular', cf_DATA.popular.books);
				cf_renderRank('cf_rank_popular',   cf_DATA.popular.rank);
				cf_renderBooks('cf_books_social',   cf_DATA.social.books);
				cf_renderRank('cf_rank_social',     cf_DATA.social.rank);
				cf_renderBooks('cf_books_art',      cf_DATA.art.books);
				cf_renderRank('cf_rank_art',        cf_DATA.art.rank);
			}

			if (document.readyState === 'loading') {
				document.addEventListener('DOMContentLoaded', cf_renderAll);
			} else {
				cf_renderAll();
			}
		})();
	</script>
</body>
</html>
