<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据类型与运算符</title>
</head>
<body>
    <div class="container">

    </div>
<script>
    var a = 10,b = 4;
    // 控制台输出
    console.log(a + b); // 14
    console.log(a-b>0?a:b); // 10
    console.log(true&&false,true||false,!true); // false true false
    var str = "hello world",num = 10,ble = true,ud,obj = {name:"张三",age:20},arr = [1,2,3,4];
    console.log(typeof str,typeof num,typeof ble,typeof ud,typeof obj,typeof arr); // string number boolean undefined object object
    console.log(0.1+0.2==0.3);
    console.log("wangyao"-1); // false
</script>
</body>
</html>
